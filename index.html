<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spatium • Movies</title>

    <style>
        @import "https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,200..800;1,200..800&display=swap";

        :root {
            --white: #fff;
            --white-03: rgba(255,255,255,.03);
            --white-08: rgba(255,255,255,.08);
            --white-60: rgba(255,255,255,.6);
            --white-70: rgba(255,255,255,.7);
            --black-40: rgba(0,0,0,.4);
            --bg-dark-40: rgba(20,20,20,.4);
            --bg-darker-60: rgba(30,30,30,.6);
            --sidebar-border: rgba(57,57,57,1);
            --border-color: rgba(255,255,255,.1);
            --border-focused: rgba(255,255,255,.5);
            --search-bar-bg: rgba(255,255,255,.05);
            --gray: #808080;
        }

        * {
            font-family: 'Atkinson Hyperlegible Next', system-ui, sans-serif;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: linear-gradient(#0c0c0c, #2f2f2f);
            color: var(--white);
            overflow: hidden;
            height: 100vh;
        }

        .media-page {
            position: absolute;
            top: 0; left: 0;
            width: 100vw;
            height: 100vh;
            color: var(--white);
            overflow-y: auto;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .media-container {
            width: 100%;
            max-width: 1400px;
            padding: 60px 40px 120px;
            animation: fadeIn 0.5s ease-out;
            box-sizing: border-box;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            margin-bottom: 50px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            background: var(--white-03);
            padding: 6px;
            border-radius: 14px;
            border: 1px solid var(--sidebar-border);
        }

        .tabs button {
            padding: 8px 24px;
            background: transparent;
            border: none;
            color: var(--white-60);
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all .2s;
        }

        .tabs button.active {
            background: var(--white-08);
            color: var(--white);
            box-shadow: 0 4px 15px #0003;
        }

        .search-wrapper {
            position: relative;
            width: 100%;
            max-width: 600px;
        }

        .search-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            opacity: .5;
            width: 20px;
            height: 20px;
            pointer-events: none;
        }

        .search-input {
            width: 100%;
            padding: 12px 15px 12px 45px;
            background: var(--search-bar-bg);
            border: 1px solid var(--sidebar-border);
            border-radius: 12px;
            color: var(--white);
            font-size: 1rem;
            transition: all .3s ease;
            backdrop-filter: blur(10px);
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 30px;
        }

        .media-card {
            background: var(--bg-dark-40);
            backdrop-filter: blur(15px);
            border: 1px solid var(--sidebar-border);
            border-radius: 20px;
            overflow: hidden;
            cursor: pointer;
            transition: all .4s cubic-bezier(.165,.84,.44,1);
            display: flex;
            flex-direction: column;
        }

        .media-card:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: var(--border-focused);
            background: var(--bg-darker-60);
            box-shadow: 0 20px 40px var(--black-40);
        }

        .poster-container {
            position: relative;
            width: 100%;
            aspect-ratio: 2/3;
            overflow: hidden;
        }

        .poster {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform .6s ease;
        }

        .media-card:hover .poster {
            transform: scale(1.1);
        }

        .card-overlay {
            position: absolute;
            inset: 0;
            background: var(--black-40);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity .3s ease;
        }

        .media-card:hover .card-overlay {
            opacity: 1;
        }

        .play-icon {
            width: 50px;
            height: 50px;
            color: var(--white);
        }

        .card-details {
            padding: 15px;
        }

        .media-title {
            margin: 0;
            font-size: 1rem;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .media-date {
            margin: 4px 0 0;
            font-size: .85rem;
            color: var(--gray);
        }

        /* Detail View */
        .details-view {
            animation: fadeIn 0.4s ease;
        }

        .back-btn {
            background: var(--white-03);
            border: 1px solid var(--border-color);
            color: var(--white);
            padding: 8px 20px;
            border-radius: 10px;
            cursor: pointer;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all .2s;
        }

        .back-btn:hover {
            background: var(--white-08);
            border-color: var(--border-focused);
        }

        .meta-section {
            display: flex;
            gap: 40px;
            margin-bottom: 50px;
        }

        .detail-poster {
            width: 300px;
            border-radius: 20px;
            box-shadow: 0 20px 40px #0006;
        }

        .info-content {
            flex: 1;
        }

        .detail-title {
            font-size: 2.5rem;
            margin: 0 0 20px;
        }

        .overview {
            font-size: 1.1rem;
            line-height: 1.6;
            color: var(--white-70);
            margin-bottom: 30px;
        }

        .primary-play-btn {
            background: var(--white);
            color: var(--black);
            border: none;
            padding: 15px 40px;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: transform .2s;
        }

        .primary-play-btn:hover {
            transform: scale(1.05);
        }

        /* Player View */
        .player-view {
            position: fixed;
            inset: 0;
            z-index: 101;
            background: #000;
            display: none;
        }

        .video-player {
            width: 100%;
            height: 100%;
            border: none;
        }

        .controls-container {
            position: absolute;
            top: 25px;
            left: 25px;
            display: flex;
            gap: 15px;
            z-index: 102;
        }

        .control-button {
            width: 50px;
            height: 50px;
            border-radius: 15px;
            background: var(--bg-dark-40);
            backdrop-filter: blur(15px);
            border: 1px solid var(--sidebar-border);
            color: var(--white);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all .3s ease;
        }

        .control-button:hover {
            background: var(--nav-item-hover);
            border-color: var(--border-focused);
            transform: scale(1.1);
        }

        .loading-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 101;
            background: #000;
        }

        .loader {
            text-align: center;
            padding: 40px 0;
            color: #666;
        }

        @media (max-width: 768px) {
            .meta-section {
                flex-direction: column;
                align-items: center;
            }
            .detail-poster {
                width: 100%;
                max-width: 300px;
            }
        }
    </style>
</head>
<body>

<div class="media-page">
    <div class="media-container">

        <!-- Grid View -->
        <div id="grid-view">
            <div class="header">
                <div class="tabs">
                    <button class="active">Movies</button>
                    <button>TV Shows</button>
                </div>
                <div class="search-wrapper">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="currentColor">
                        <path d="m19.6 21l-6.3-6.3q-.75.6-1.725.95T9.5 16q-2.725 0-4.612-1.888T3 9.5t1.888-4.612T9.5 3t4.613 1.888T16 9.5q0 1.1-.35 2.075T14.7 13.3l6.3 6.3zM9.5 14q1.875 0 3.188-1.312T14 9.5t-1.312-3.187T9.5 5T6.313 6.313T5 9.5t1.313 3.188T9.5 14"/>
                    </svg>
                    <input id="search-input" type="text" placeholder="Search Movies..." class="search-input">
                </div>
            </div>

            <div id="results-grid" class="results-grid"></div>
            <div id="loader" class="loader">Loading more movies...</div>
        </div>

        <!-- Detail View -->
        <div id="detail-view" class="details-view" style="display:none;">
            <button onclick="showGrid()" class="back-btn">
                ← Back to Movies
            </button>

            <div class="meta-section">
                <img id="detail-poster" src="" alt="poster" class="detail-poster">
                <div class="info-content">
                    <h1 id="detail-title" class="detail-title"></h1>
                    <p id="detail-overview" class="overview"></p>
                    <button onclick="playCurrentMovie()" class="primary-play-btn">
                        ▶ Play Now
                    </button>
                </div>
            </div>
        </div>

        <!-- Player View -->
        <div id="player-view" class="player-view">
            <div class="controls-container">
                <button onclick="closePlayer()" class="control-button" title="Back to Details">
                    <svg viewBox="0 0 24 24" width="1.2em" height="1.2em" fill="currentColor">
                        <path d="m7.825 13l5.6 5.6L12 20l-8-8l8-8l1.425 1.4l-5.6 5.6H20v2z"/>
                    </svg>
                </button>
                <button onclick="reloadStream()" class="control-button" title="Reload Stream">
                    <svg viewBox="0 0 24 24" width="1.2em" height="1.2em" fill="currentColor">
                        <path d="M12 20q-3.35 0-5.675-2.325T4 12t2.325-5.675T12 4q1.725 0 3.3.712T18 6.75V4h2v7h-7V9h4.2q-.8-1.4-2.187-2.2T12 6Q9.5 6 7.75 7.75T6 12t1.75 4.25T12 18q1.925 0 3.475-1.1T17.65 14h2.1q-.7 2.65-2.85 4.325T12 20"/>
                    </svg>
                </button>
                <button onclick="toggleFullscreen()" class="control-button" title="Toggle Fullscreen">
                    <svg viewBox="0 0 24 24" width="1.2em" height="1.2em" fill="currentColor">
                        <path d="M3 21v-5h2v3h3v2zm13 0v-2h3v-3h2v5zM3 8V3h5v2H5v3zm16 0V5h-3V3h5v5z"/>
                    </svg>
                </button>
            </div>

            <div class="loading-overlay" id="loading-overlay">
                <div class="loader">Loading stream...</div>
            </div>

            <video id="video-player" controls autoplay class="video-player"></video>
        </div>

    </div>
</div>

<script>
// Load movies from movies.json
async function loadMovies() {
    try {
        const res = await fetch('movies.json');
        if (!res.ok) throw new Error('Failed to load movies.json');
        return await res.json();
    } catch (e) {
        console.error(e);
        return []; // fallback empty
    }
}

let allMovies = [];
let currentMovie = null;
let loadedCount = 0;
const batchSize = 12;

async function init() {
    allMovies = await loadMovies();
    if (allMovies.length === 0) {
        document.getElementById('results-grid').innerHTML = '<p style="color:#666; grid-column:1/-1; text-align:center;">No movies found in movies.json</p>';
        return;
    }
    renderMovies(allMovies.slice(0, batchSize));
    loadedCount = batchSize;
}

function renderMovies(movies) {
    const grid = document.getElementById('results-grid');
    movies.forEach(movie => {
        const card = document.createElement('div');
        card.className = 'media-card';
        card.innerHTML = `
            <div class="poster-container">
                <img src="${movie.poster}" alt="${movie.title}" class="poster">
                <div class="card-overlay">
                    <svg viewBox="0 0 24 24" width="50" height="50" fill="currentColor" class="play-icon">
                        <path d="M8 19V5l11 7z"/>
                    </svg>
                </div>
            </div>
            <div class="card-details">
                <h3 class="media-title">${movie.title}</h3>
                <p class="media-date">${movie.year}</p>
            </div>
        `;
        card.onclick = () => showDetail(movie);
        grid.appendChild(card);
    });
}

function showDetail(movie) {
    currentMovie = movie;
    document.getElementById('grid-view').style.display = 'none';
    document.getElementById('detail-view').style.display = 'block';

    document.getElementById('detail-poster').src = movie.poster;
    document.getElementById('detail-title').textContent = movie.title;
    document.getElementById('detail-overview').textContent = movie.overview || "No overview available.";
}

function showGrid() {
    document.getElementById('detail-view').style.display = 'none';
    document.getElementById('grid-view').style.display = 'block';
}

function playCurrentMovie() {
    if (!currentMovie || !currentMovie.streamUrl) {
        alert("No stream URL available.");
        return;
    }

    const proxyUrl = `/api/streaming/proxy?url=${encodeURIComponent(currentMovie.streamUrl)}&referer=${encodeURIComponent('https://videostr.net/')}`;

    // Show player view
    document.getElementById('player-view').style.display = 'block';
    const video = document.getElementById('video-player');
    video.src = proxyUrl;
    video.play().catch(() => {});

    document.getElementById('loading-overlay').style.display = 'flex';
    video.onloadeddata = () => {
        document.getElementById('loading-overlay').style.display = 'none';
    };
}

function closePlayer() {
    const video = document.getElementById('video-player');
    video.pause();
    video.src = '';
    document.getElementById('player-view').style.display = 'none';
    document.getElementById('loading-overlay').style.display = 'none';
}

function reloadStream() {
    const video = document.getElementById('video-player');
    video.load();
    video.play();
}

function toggleFullscreen() {
    const video = document.getElementById('video-player');
    if (!document.fullscreenElement) {
        video.requestFullscreen();
    } else {
        document.exitFullscreen();
    }
}

// Infinite Scroll
window.addEventListener('scroll', () => {
    if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 400) {
        const loader = document.getElementById('loader');
        loader.style.display = 'block';

        setTimeout(() => {
            const more = allMovies.slice(loadedCount, loadedCount + batchSize);
            if (more.length > 0) {
                renderMovies(more);
                loadedCount += more.length;
            }
            loader.style.display = 'none';
        }, 600);
    }
});

// Initialize
init();

</script>

</body>
</html
