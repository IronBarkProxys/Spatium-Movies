<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spatium • Movies</title>

    <style>
        @import "https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,200..800;1,200..800&display=swap";

        :root {
            --white: #fff;
            --white-03: rgba(255,255,255,.03);
            --white-08: rgba(255,255,255,.08);
            --white-60: rgba(255,255,255,.6);
            --white-70: rgba(255,255,255,.7);
            --black-40: rgba(0,0,0,.4);
            --bg-dark-40: rgba(20,20,20,.4);
            --bg-darker-60: rgba(30,30,30,.6);
            --sidebar-border: rgba(57,57,57,1);
            --border-color: rgba(255,255,255,.1);
            --border-focused: rgba(255,255,255,.5);
            --search-bar-bg: rgba(255,255,255,.05);
            --gray: #808080;
        }

        * { font-family: 'Atkinson Hyperlegible Next', system-ui, sans-serif; box-sizing: border-box; }

        body {
            margin: 0;
            background: linear-gradient(#0c0c0c, #2f2f2f);
            color: var(--white);
            overflow: hidden;
            height: 100vh;
        }

        .media-page {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .media-container {
            width: 100%;
            max-width: 1400px;
            padding: 60px 40px 120px;
        }

        .header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            margin-bottom: 50px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            background: var(--white-03);
            padding: 6px;
            border-radius: 14px;
            border: 1px solid var(--sidebar-border);
        }

        .tabs button {
            padding: 8px 24px;
            background: transparent;
            border: none;
            color: var(--white-60);
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
        }

        .tabs button.active {
            background: var(--white-08);
            color: var(--white);
        }

        .search-wrapper {
            position: relative;
            width: 100%;
            max-width: 600px;
        }

        .search-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            opacity: .5;
        }

        .search-input {
            width: 100%;
            padding: 12px 15px 12px 45px;
            background: var(--search-bar-bg);
            border: 1px solid var(--sidebar-border);
            border-radius: 12px;
            color: var(--white);
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 30px;
        }

        .media-card {
            background: var(--bg-dark-40);
            border: 1px solid var(--sidebar-border);
            border-radius: 20px;
            overflow: hidden;
            cursor: pointer;
            transition: all .4s;
        }

        .media-card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 20px 40px var(--black-40);
        }

        .poster-container { position: relative; aspect-ratio: 2/3; overflow: hidden; }
        .poster { width: 100%; height: 100%; object-fit: cover; transition: .6s; }
        .media-card:hover .poster { transform: scale(1.1); }

        .card-overlay {
            position: absolute;
            inset: 0;
            background: var(--black-40);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: .3s;
        }

        .media-card:hover .card-overlay { opacity: 1; }

        .card-details { padding: 15px; }
        .media-title { font-size: 1rem; font-weight: 700; margin: 0; }
        .media-date { font-size: .85rem; color: var(--gray); margin: 4px 0 0; }

        /* Detail View */
        .details-view { display: none; animation: fadeIn 0.4s; }
        .back-btn {
            background: var(--white-03);
            border: 1px solid var(--border-color);
            color: var(--white);
            padding: 8px 20px;
            border-radius: 10px;
            cursor: pointer;
            margin-bottom: 30px;
        }

        .meta-section { display: flex; gap: 40px; margin-bottom: 50px; }
        .detail-poster { width: 300px; border-radius: 20px; }
        .detail-title { font-size: 2.5rem; margin: 0 0 20px; }
        .overview { font-size: 1.1rem; line-height: 1.6; color: var(--white-70); }

        .primary-play-btn {
            background: white;
            color: black;
            border: none;
            padding: 15px 40px;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
        }

        /* Player View */
        .player-view {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 200;
            display: none;
            flex-direction: column;
        }

        .video-player {
            flex: 1;
            width: 100%;
            height: 100%;
        }

        .controls-container {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            gap: 12px;
            z-index: 210;
        }

        .control-button {
            width: 48px;
            height: 48px;
            background: rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 12px;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .loading-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #aaa;
            z-index: 205;
        }
    </style>
</head>
<body>

<div class="media-page">
    <div class="media-container">

        <!-- Grid -->
        <div id="grid-view">
            <div class="header">
                <div class="tabs">
                    <button class="active">Movies</button>
                    <button>TV Shows</button>
                </div>
                <div class="search-wrapper">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="currentColor"><path d="m19.6 21l-6.3-6.3q-.75.6-1.725.95T9.5 16q-2.725 0-4.612-1.888T3 9.5t1.888-4.612T9.5 3t4.613 1.888T16 9.5q0 1.1-.35 2.075T14.7 13.3l6.3 6.3zM9.5 14q1.875 0 3.188-1.312T14 9.5t-1.312-3.187T9.5 5T6.313 6.313T5 9.5t1.313 3.188T9.5 14"/></svg>
                    <input id="search-input" placeholder="Search Movies..." class="search-input">
                </div>
            </div>

            <div id="results-grid" class="results-grid"></div>
            <div id="loader" class="loader">Loading more movies...</div>
        </div>

        <!-- Detail View -->
        <div id="detail-view" class="details-view" style="display:none;">
            <button onclick="showGrid()" class="back-btn">← Back to Movies</button>
            <div class="meta-section">
                <img id="detail-poster" src="" class="detail-poster" alt="">
                <div class="info-content">
                    <h1 id="detail-title" class="detail-title"></h1>
                    <p id="detail-overview" class="overview"></p>
                    <button onclick="playMovie()" class="primary-play-btn">▶ Play Now</button>
                </div>
            </div>
        </div>

        <!-- Player View -->
        <div id="player-view" class="player-view">
            <div class="controls-container">
                <button onclick="closePlayer()" class="control-button" title="Back">←</button>
                <button onclick="reloadPlayer()" class="control-button" title="Reload">↻</button>
                <button onclick="toggleFullscreen()" class="control-button" title="Fullscreen">⛶</button>
            </div>
            <div id="loading-overlay" class="loading-overlay">Loading stream...</div>
            <video id="video-player" class="video-player" controls autoplay></video>
        </div>

    </div>
</div>

<script>
// Load from movies.json
async function loadMovies() {
    try {
        const res = await fetch('movies.json');
        return await res.json();
    } catch(e) {
        console.error("Could not load movies.json", e);
        return [];
    }
}

let allMovies = [];
let currentMovie = null;
let loadedCount = 0;
const batchSize = 12;

async function init() {
    allMovies = await loadMovies();
    renderMovies(allMovies.slice(0, batchSize));
    loadedCount = batchSize;
}

function renderMovies(movies) {
    const grid = document.getElementById('results-grid');
    grid.innerHTML = '';
    movies.forEach(movie => {
        const card = document.createElement('div');
        card.className = 'media-card';
        card.innerHTML = `
            <div class="poster-container">
                <img src="${movie.poster}" alt="${movie.title}" class="poster">
                <div class="card-overlay">
                    <svg viewBox="0 0 24 24" width="50" height="50" fill="currentColor"><path d="M8 19V5l11 7z"/></svg>
                </div>
            </div>
            <div class="card-details">
                <h3 class="media-title">${movie.title}</h3>
                <p class="media-date">${movie.year}</p>
            </div>
        `;
        card.onclick = () => showDetail(movie);
        grid.appendChild(card);
    });
}

function showDetail(movie) {
    currentMovie = movie;
    document.getElementById('grid-view').style.display = 'none';
    document.getElementById('detail-view').style.display = 'block';

    document.getElementById('detail-poster').src = movie.poster;
    document.getElementById('detail-title').textContent = movie.title;
    document.getElementById('detail-overview').textContent = movie.overview || "No description available.";
}

function showGrid() {
    document.getElementById('detail-view').style.display = 'none';
    document.getElementById('grid-view').style.display = 'block';
}

function playMovie() {
    if (!currentMovie || !currentMovie.streamUrl) {
        alert("No stream URL available for this movie.");
        return;
    }

    const proxyUrl = `/api/streaming/proxy?url=${encodeURIComponent(currentMovie.streamUrl)}&referer=${encodeURIComponent('https://videostr.net/')}`;

    // Show player
    const playerView = document.getElementById('player-view');
    const video = document.getElementById('video-player');

    playerView.style.display = 'flex';
    video.src = proxyUrl;
    video.play().catch(err => console.error("Playback failed:", err));
}

function closePlayer() {
    const video = document.getElementById('video-player');
    video.pause();
    video.src = '';
    document.getElementById('player-view').style.display = 'none';
}

function reloadPlayer() {
    const video = document.getElementById('video-player');
    video.load();
    video.play();
}

function toggleFullscreen() {
    const video = document.getElementById('video-player');
    if (!document.fullscreenElement) video.requestFullscreen();
    else document.exitFullscreen();
}

// Infinite scroll
window.addEventListener('scroll', () => {
    if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 400) {
        const more = allMovies.slice(loadedCount, loadedCount + batchSize);
        if (more.length > 0) {
            renderMovies(more);
            loadedCount += more.length;
        }
    }
});

init();
</script>

</body>
</html>
